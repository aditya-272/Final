<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Kumar | Pro Card</title>

  <!-- Preconnect to Google Fonts for lightning-fast font loading without CSS @import blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --allen-green: #00ff88;
      --allen-dark: #008f5d;
      --neon-pink: #ff4fd8;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    /* Ambient background glows using hardware-accelerated transforms */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: 
        radial-gradient(circle at 12% 15%, rgba(0, 255, 136, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 88% 85%, rgba(255, 79, 216, 0.22) 0%, transparent 40%);
    }

    /* Snappy welcome screen: disappears in ~0.6s instead of waiting 3.3+ seconds */
    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .welcome-msg {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(24px, 6vw, 32px);
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.35;
      background: linear-gradient(to bottom, #fff, var(--allen-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Main glassmorphism card */
    .card {
      position: relative;
      width: 100%;
      max-width: 340px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 48px 24px 38px;
      border-radius: 36px;
      text-align: center;
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .allen-tag {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--allen-green);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 8px 22px;
      border-radius: 50px;
      box-shadow: 0 5px 0 var(--allen-dark);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .profile-box {
      margin-top: 5px;
    }

    .profile-box img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--neon-pink);
      padding: 4px;
      object-fit: cover;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      margin: 18px 0 12px;
      letter-spacing: 1px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 15px;
      border: 1px solid var(--glass-border);
      text-align: left;
    }

    .stat-box.full-width {
      grid-column: span 2;
    }

    .stat-label {
      color: var(--allen-green);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
    }

    .stat-value {
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-top: 3px;
    }

    /* Clean 3D social dock */
    .links-dock {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 25px 0;
    }

    .social-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.65);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      text-decoration: none;
      cursor: pointer;
    }

    .social-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.65);
    }

    .icon-img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      pointer-events: none;
    }

    .play-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.25), rgba(0, 212, 255, 0.25));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--allen-green);
      box-shadow: 0 6px 0 var(--allen-dark);
      padding: 15px;
      border-radius: 18px;
      color: #fff;
      font-weight: 800;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
    }

    .play-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--allen-dark);
    }

    .play-btn.playing {
      background: linear-gradient(135deg, rgba(255, 79, 216, 0.35), rgba(0, 255, 136, 0.25));
      border-color: var(--neon-pink);
      box-shadow: 0 6px 0 #b32e94;
    }

    .play-btn.playing:active {
      box-shadow: 0 2px 0 #b32e94;
    }

    .view-counter {
      position: absolute;
      bottom: 12px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="bg-glow"></div>

  <!-- Fast Welcome Splash (Smooth 0.5s auto-exit) -->
  <div id="welcome-screen">
    <div class="welcome-msg">WELCOME TO<br>MY PROFILE</div>
  </div>

  <!-- Glass Card -->
  <div class="card" id="main-card">
    <div class="allen-tag">ALLEN STUDENT</div>

    <div class="profile-box">
      <img src="https://files.catbox.moe/igx398.webp" 
           alt="Aditya Kumar" 
           loading="eager" 
           decoding="async" 
           width="100" 
           height="100">
    </div>

    <h2>ADITYA KUMAR</h2>

    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-label">:: TARGET</span>
        <span class="stat-value">IIT-JEE 2027</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">:: GRADE</span>
        <span class="stat-value">Class 12th+</span>
      </div>
      <div class="stat-box full-width">
        <span class="stat-label">:: PASSION</span>
        <span class="stat-value">Coding &amp; Web Development</span>
      </div>
    </div>

    <!-- Social Dock -->
    <div class="links-dock">
      <a class="social-btn" href="https://www.instagram.com/exp_aditya_1" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="https://files.catbox.moe/lym859.jpg" class="icon-img" alt="Instagram" loading="lazy" decoding="async" width="28" height="28">
      </a>
      <a class="social-btn" href="https://discord.com/users/1380785617339940864" target="_blank" rel="noopener noreferrer" aria-label="Discord">
        <img src="https://files.catbox.moe/h34x06.jpg" class="icon-img" alt="Discord" loading="lazy" decoding="async" width="28" height="28">
      </a>
      <a class="social-btn" href="https://wa.me/917280825631" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
        <img src="https://files.catbox.moe/1oglup.jpg" class="icon-img" alt="WhatsApp" loading="lazy" decoding="async" width="28" height="28">
      </a>
    </div>

    <button id="play-trigger" class="play-btn">START STUDY VIBES</button>

    <div class="view-counter">
      <span style="color:var(--allen-green)">👁</span>
      <span id="v-count">...</span>
    </div>
  </div>

  <script>
    // 1. Instant card reveal (0.5s brief greeting, no waiting for full images/audio)
    document.addEventListener('DOMContentLoaded', () => {
      const welcome = document.getElementById('welcome-screen');
      const card = document.getElementById('main-card');

      setTimeout(() => {
        welcome.style.opacity = '0';
        welcome.style.pointerEvents = 'none';
        
        card.classList.add('visible');
        setTimeout(() => {
          welcome.style.display = 'none';
        }, 400);
      }, 500);

      // Instant Visit Counter
      let count = localStorage.getItem('aditya_visits') || 1520;
      count = parseInt(count, 10) + 1;
      localStorage.setItem('aditya_visits', count);
      document.getElementById('v-count').innerText = count.toLocaleString();
    });

    // 2. Lazy audio loaders: zero network bandwidth taken until user clicks
    let sfxAudio = null;
    let bgAudio = null;

    const SFX_URL = "https://www.image2url.com/r2/default/audio/1778299814950-b378c95d-9af0-4fc8-914e-66d3c4364459.mp3";
    const MUSIC_URL = "https://www.image2url.com/r2/default/audio/1778175639516-4694845f-299f-4d56-99d8-a4a60165de78.mp3";

    // Social buttons with fast SFX and immediate responsive feedback
    const socialButtons = document.querySelectorAll('.social-btn');
    socialButtons.forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const targetURL = this.getAttribute('href');

        if (!sfxAudio) {
          sfxAudio = new Audio(SFX_URL);
        }
        sfxAudio.currentTime = 0;
        sfxAudio.play().catch(() => {});

        // Reduced delay to 350ms so user doesn't feel lag
        setTimeout(() => {
          window.open(targetURL, '_blank', 'noopener,noreferrer');
        }, 350);
      });
    });

    // Toggle study music with lazy instant load
    const playBtn = document.getElementById('play-trigger');
    playBtn.addEventListener('click', () => {
      if (!bgAudio) {
        bgAudio = new Audio(MUSIC_URL);
        bgAudio.loop = true;
      }

      if (bgAudio.paused) {
        playBtn.innerText = "LOADING...";
        bgAudio.play().then(() => {
          playBtn.innerText = "PAUSE STUDY VIBES";
          playBtn.classList.add('playing');
        }).catch(() => {
          playBtn.innerText = "START STUDY VIBES";
        });
      } else {
        bgAudio.pause();
        playBtn.innerText = "START STUDY VIBES";
        playBtn.classList.remove('playing');
      }
    });
  </script>
</body>
</html>

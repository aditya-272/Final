<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Kumar | Pro Card</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&family=JetBrains+Mono:wght@700&display=swap');

  :root {
    --allen-green: #00ff88;
    --neon-pink: #ff4fd8;
    --glass-bg: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.2);
  }

  body {
    margin: 0; height: 100vh; background: #000; color: white;
    font-family: 'Poppins', sans-serif; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  /* BACKGROUND GLOWS */
  .bg-glow {
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(circle at 10% 10%, rgba(0, 255, 136, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 79, 216, 0.25) 0%, transparent 40%);
  }

  /* --- STYLISH CENTERED WELCOME (2.5s) --- */
  #welcome-screen {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; justify-content: center; align-items: center;
    transition: 0.8s ease-in-out;
  }

  .welcome-msg {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px; letter-spacing: 5px; text-align: center;
    background: linear-gradient(to bottom, #fff, var(--allen-green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
    animation: fadeInOut 2.5s forwards;
  }

  @keyframes fadeInOut {
    0% { opacity: 0; transform: scale(0.8); }
    20% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
  }

  /* --- MAIN GLASSY 3D CARD --- */
  .card {
    position: relative; width: 330px; 
    background: var(--glass-bg);
    backdrop-filter: blur(30px); 
    padding: 50px 25px 40px; border-radius: 40px;
    text-align: center; border: 1px solid var(--glass-border);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    display: none; animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

  .allen-tag {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    background: var(--allen-green); color: #000; font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 900; padding: 10px 30px; border-radius: 50px;
    box-shadow: 0 6px 0 #009e54; letter-spacing: 2px;
  }

  .profile-box img {
    width: 105px; height: 105px; border-radius: 50%; 
    border: 3px solid var(--neon-pink); padding: 5px; 
    object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
  }

  h2 { font-family: 'Orbitron', sans-serif; font-size: 22px; margin: 20px 0 10px; }

  .stats-container {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 25px 0;
  }

  .stat-box {
    background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 15px;
    border: 1px solid var(--glass-border); text-align: left;
  }

  .stat-label { color: var(--allen-green); font-family: 'JetBrains Mono', monospace; font-size: 9px; }
  .stat-value { color: #fff; font-size: 12px; font-weight: 600; display: block; margin-top: 2px; }

  /* --- CLEAN 3D ICONS --- */
  .links-dock {
    display: flex; justify-content: center; gap: 20px; margin: 30px 0;
  }

  .social-btn {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    width: 55px; height: 55px; display: flex; align-items: center; justify-content: center;
    border-radius: 18px; border: 1px solid var(--glass-border);
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.6); 
    transition: 0.1s; text-decoration: none;
    cursor: pointer;
  }

  .social-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); }

  .icon-img { 
    width: 30px; height: 30px; 
    border-radius: 6px; object-fit: cover;
  }

  /* 3D GLASS PLAY BUTTON */
  .play-btn {
    width: 100%; background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,212,255,0.3));
    backdrop-filter: blur(10px); border: 1px solid var(--allen-green);
    box-shadow: 0 6px 0 #008f5d; padding: 16px; border-radius: 20px;
    color: #fff; font-weight: 800; font-family: 'Orbitron'; cursor: pointer; transition: 0.1s;
  }

  .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #008f5d; }

  .view-counter {
    position: absolute; bottom: 15px; right: 25px; display: flex; align-items: center;
    gap: 6px; color: rgba(255, 255, 255, 0.4); font-size: 11px;
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>

  <div id="welcome-screen">
    <div class="welcome-msg">WELCOME TO<br>MY PROFILE</div>
  </div>

  <div class="card" id="main-card">
    <div class="allen-tag">ALLEN STUDENT</div>
    
    <div class="profile-box">
      <img src="https://files.catbox.moe/igx398.webp" alt="Aditya">
    </div>

    <h2>ADITYA KUMAR</h2>
    
    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-label">:: TARGET</span>
        <span class="stat-value">IIT-JEE 2027</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">:: GRADE</span>
        <span class="stat-value">Class 11th</span>
      </div>
      <div class="stat-item" style="grid-column: span 2; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; border: 1px solid var(--glass-border); text-align: left;">
        <span class="stat-label">:: PASSION</span>
        <span class="stat-value">Coding & Web Development</span>
      </div>
    </div>

    <div class="links-dock">
      <a class="social-btn" href="https://www.instagram.com/exp_aditya_1" target="_blank">
        <img src="https://files.catbox.moe/lym859.jpg" class="icon-img">
      </a>
      <a class="social-btn" href="https://discord.com/users/1380785617339940864" target="_blank">
        <img src="https://files.catbox.moe/h34x06.jpg" class="icon-img">
      </a>
      <a class="social-btn" href="https://wa.me/917280825631" target="_blank">
        <img src="https://files.catbox.moe/1oglup.jpg" class="icon-img">
      </a>
    </div>

    <button class="play-btn" onclick="togglePlay()">START STUDY VIBES</button>

    <div class="view-counter">
      <span style="color:var(--allen-green)">👁</span>
      <span id="v-count">...</span>
    </div>
  </div>

<script>
  // 1. CLICK SOUND & DELAY LOGIC (For Social Buttons Only)
  const btnSFX = new Audio("https://www.image2url.com/r2/default/audio/1778299814950-b378c95d-9af0-4fc8-914e-66d3c4364459.mp3");
  const socialButtons = document.querySelectorAll('.social-btn');
  
  socialButtons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault(); // Stop immediate link open
      
      btnSFX.currentTime = 0;
      btnSFX.play(); // Play click sound
      
      const targetURL = this.getAttribute('href');

      // Open link after 1.2 seconds of sound latency
      setTimeout(() => {
        window.open(targetURL, '_blank');
      }, 1200);
    });
  });

  // 2. AUTO REVEAL 2.5s
  window.onload = () => {
    setTimeout(() => {
      document.getElementById('welcome-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('main-card').style.display = 'block';
      }, 800);
    }, 2500);
  };

  // 3. MUSIC LOGIC (No delay here, starts instantly)
  const bgMusic = new Audio("https://www.image2url.com/r2/default/audio/1778175639516-4694845f-299f-4d56-99d8-a4a60165de78.mp3");
  function togglePlay() { 
    bgMusic.paused ? bgMusic.play() : bgMusic.pause(); 
  }

  // 4. COUNTER
  let v = localStorage.getItem('aditya_visits') || 1520;
  v = parseInt(v) + 1; localStorage.setItem('aditya_visits', v);
  document.getElementById('v-count').innerText = v.toLocaleString();
</script>

</body>
</html>
